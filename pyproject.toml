[project]
name = "market-platform"
version = "0.1.0"
description = "Market data pipeline and trading platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14.0",
    "apache-airflow>=3.2.2",
    "apache-airflow-providers-fab>=3.7.1",
    "clickhouse-connect>=0.8.0",
    "jsonschema>=4.23.0",
    "kafka>=1.3.5",
    "kafka-python-ng>=2.2.3",
    "minio>=7.2.0",
    "numpy>=2.0.0",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=18.0.0",
    "werkzeug>=3.1.8",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
