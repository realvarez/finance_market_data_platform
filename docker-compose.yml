services:

  broker:
    image: confluentinc/cp-server:7.6.0
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      CLUSTER_ID: 'eMR-IFA7RgSQb3UDnGHyUw'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_METADATA_LOG_DIR: '/var/lib/kafka/data'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONFLUENT_METRICS_ENABLE: 'false'
      KAFKA_CONFLUENT_BALANCER_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - market_platform_network
    healthcheck:
      test: [ "CMD", "bash", "-c", 'nc -z localhost 9092' ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-init:
    image: confluentinc/cp-server:7.6.0
    container_name: kafka-init
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - ./infra/kafka/init-topics.sh:/init-topics.sh
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
    entrypoint: [ "bash", "/init-topics.sh" ]
    networks:
      - market_platform_network

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.2
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - market_platform_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.6.12
    hostname: control-center
    container_name: control-center
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'broker:29092'
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_ENABLE: 'false'
      PORT: 9021
    networks:
      - market_platform_network

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - market_platform_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - market_platform_network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8123/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  spark-master:
    image: spark:4.0.2-java21-python3
    container_name: spark-master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "8082:8080"
      - "7077:7077"
    volumes:
      - .:/app
      - ./streaming:/opt/spark/apps
    networks:
      - market_platform_network

  spark-worker:
    image: spark:4.0.2-java21-python3
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1g
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - .:/app
      - ./streaming:/opt/spark/apps
    networks:
      - market_platform_network

  candle-builder:
    image: spark:4.0.2-java21-python3
    container_name: candle-builder
    # spark-submit is not on PATH in this image; use the absolute path.
    command: >
      /opt/spark/bin/spark-submit --master spark://spark-master:7077
      --deploy-mode client
      /opt/spark/apps/stream_candle_builder.py
    depends_on:
      broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - .:/app
      - ./streaming:/opt/spark/apps
    restart: unless-stopped
    networks:
      - market_platform_network

  tick-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tick-ingestion
    depends_on:
      broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SYMBOLS: "NVDA,AAPL,SPY"
    restart: unless-stopped
    networks:
      - market_platform_network

  tick-sink:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tick-sink
    command: uv run --no-dev python -m entrypoint.tick_sink_service
    depends_on:
      broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      clickhouse:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      MINIO_ENDPOINT: minio:9000
      CLICKHOUSE_HOST: clickhouse
    restart: unless-stopped
    networks:
      - market_platform_network

  postgres:
    container_name: postgres_db
    image: postgres:16.0
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - market_platform_network

  airflow:
    container_name: airflow
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: standalone
    depends_on:
      postgres:
        condition: service_started
      broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true' 
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      AIRFLOW__WEBSERVER__SECRET_KEY: 'developer-secret-key'
      AIRFLOW__API__SECRET_KEY: 'developer-secret-key'
      # SimpleAuthManager with all-admins: no login required in local dev.
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      PYTHONPATH: /opt/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - ./streaming:/opt/airflow/streaming
      - ./storage:/opt/airflow/storage
      - ./analysis:/opt/airflow/analysis
      - ./schemas:/opt/airflow/schemas
      - ./utils:/opt/airflow/utils
    ports:
      - "8080:8080"
    networks:
      - market_platform_network


networks:
  market_platform_network:

volumes:
  kafka_data:
  minio_data:
  clickhouse_data:
  postgres_data:
