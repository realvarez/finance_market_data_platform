services:

  broker:
    image: confluentinc/cp-kafka:7.6.0
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      CLUSTER_ID: 'eMR-IFA7RgSQb3UDnGHyUw'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_METADATA_LOG_DIR: '/var/lib/kafka/data'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 1.0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - market_platform_network
    healthcheck:
      test: [ "CMD", "bash", "-c", 'nc -z localhost 9092' ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - ./infra/kafka/init-topics.sh:/init-topics.sh
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
    entrypoint: [ "/bin/bash", "-c", "tr -d '\\r' < /init-topics.sh | /bin/bash" ]
    mem_limit: 128m
    restart: "no"
    networks:
      - market_platform_network

  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    profiles:
      - ui
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "9021:8080"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m"
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            market-platform:
              properties:
                bootstrap.servers: "broker:29092"
    mem_limit: 384m
    cpus: 0.5
    networks:
      - market_platform_network

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_API_REQUESTS_MAX: "100"
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - market_platform_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    ports:
      - "8123:8123"
      - "9009:9000"
    # 768m left only ~70MB headroom over ClickHouse's observed ~695MB RSS, which made
    # OPTIMIZE and heavier queries fail with MEMORY_LIMIT_EXCEEDED.
    mem_limit: 1280m
    mem_reservation: 384m
    cpus: 1.0
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infra/clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml
    networks:
      - market_platform_network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8123/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} >/dev/null 2>&1; do sleep 2; done; mc mb --ignore-existing local/market-data && echo 'MinIO bucket market-data ready'"
    mem_limit: 128m
    restart: "no"
    networks:
      - market_platform_network

  spark-master:
    image: spark:4.0.2-java21-python3
    container_name: spark-master
    profiles:
      - spark-cluster
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --webui-port 8080
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c 'import socket; socket.create_connection((\"localhost\", 8080), 2)'" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "8082:8080"
      - "7077:7077"
    volumes:
      - .:/app
      - ./streaming:/opt/spark/apps
    networks:
      - market_platform_network

  spark-worker:
    image: spark:4.0.2-java21-python3
    container_name: spark-worker
    profiles:
      - spark-cluster
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker -c 2 -m 1g spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    mem_limit: 768m
    cpus: 1.0
    volumes:
      - .:/app
      - ./streaming:/opt/spark/apps
    networks:
      - market_platform_network

  candle-builder:
    image: spark:4.0.2-java21-python3
    container_name: candle-builder
    # --packages is REQUIRED under spark-submit: spark.jars.packages set inside
    # SparkSession.builder is ignored when submitting a job (connector versions
    # matched to the 4.0.2 runtime / Hadoop 3.4.1).
    ports:
      - "4040:4040"
    command: >
      /opt/spark/bin/spark-submit --master local[2] --driver-memory 768m --conf spark.sql.shuffle.partitions=2 --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.2,org.apache.hadoop:hadoop-aws:3.4.1,com.amazonaws:aws-java-sdk-bundle:1.12.780 /opt/spark/apps/stream_candle_builder.py
    depends_on:
      broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    mem_limit: 1024m
    cpus: 1.5
    # Run as root so Ivy can write its package cache to /root/.ivy2 (the image's
    # default uid 185 has HOME=/nonexistent and cannot persist --packages downloads).
    user: root
    volumes:
      - .:/app
      - ./streaming:/opt/spark/apps
      - spark_ivy_cache:/root/.ivy2
    restart: unless-stopped
    networks:
      - market_platform_network

  tick-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tick-ingestion
    depends_on:
      broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SYMBOLS: "${SYMBOLS:-BTC-USD,NVDA,MSTR,NU,HIMS,MU}"
    mem_limit: 192m
    cpus: 0.5
    restart: unless-stopped
    # Source is mounted (not baked) so code edits need only `docker compose restart`, matching
    # the airflow service. Rebuild the image only when pyproject.toml / uv.lock change.
    volumes:
      - ./ingestion:/app/ingestion
      - ./entrypoint:/app/entrypoint
      - ./schemas:/app/schemas
      - ./storage:/app/storage
      - ./utils:/app/utils
    networks:
      - market_platform_network

  tick-sink:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tick-sink
    command: uv run --no-dev python -m entrypoint.tick_sink_service
    depends_on:
      broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-market_platform}
    mem_limit: 192m
    cpus: 0.5
    restart: unless-stopped
    # Source is mounted (not baked) so code edits need only `docker compose restart`, matching
    # the airflow service. Rebuild the image only when pyproject.toml / uv.lock change.
    volumes:
      - ./ingestion:/app/ingestion
      - ./entrypoint:/app/entrypoint
      - ./schemas:/app/schemas
      - ./storage:/app/storage
      - ./utils:/app/utils
    networks:
      - market_platform_network

  candle-sink:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: candle-sink
    command: uv run --no-dev python -m entrypoint.candle_sink_service
    depends_on:
      broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-market_platform}
    mem_limit: 192m
    cpus: 0.5
    restart: unless-stopped
    # Source is mounted (not baked) so code edits need only `docker compose restart`, matching
    # the airflow service. Rebuild the image only when pyproject.toml / uv.lock change.
    volumes:
      - ./ingestion:/app/ingestion
      - ./entrypoint:/app/entrypoint
      - ./schemas:/app/schemas
      - ./storage:/app/storage
      - ./utils:/app/utils
    networks:
      - market_platform_network

  postgres:
    container_name: postgres_db
    image: postgres:16.0
    command: postgres -c shared_buffers=64MB -c max_connections=30
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-airflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-airflow}
      - POSTGRES_DB=${POSTGRES_DB:-airflow}
    mem_limit: 192m
    mem_reservation: 96m
    cpus: 0.5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - market_platform_network

  airflow:
    container_name: airflow
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: standalone
    depends_on:
      postgres:
        condition: service_started
      broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      AIRFLOW__WEBSERVER__SECRET_KEY: '${AIRFLOW_SECRET_KEY:-developer-secret-key}'
      AIRFLOW__API__SECRET_KEY: '${AIRFLOW_SECRET_KEY:-developer-secret-key}'
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "60"
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
      # SimpleAuthManager with all-admins: no login required in local dev.
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-market_platform}
      PYTHONPATH: /opt/airflow
    mem_limit: 1024m
    mem_reservation: 512m
    cpus: 1.5
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - ./streaming:/opt/airflow/streaming
      - ./storage:/opt/airflow/storage
      - ./analysis:/opt/airflow/analysis
      - ./schemas:/opt/airflow/schemas
      - ./utils:/opt/airflow/utils
    ports:
      - "8080:8080"
    networks:
      - market_platform_network

networks:
  market_platform_network:

volumes:
  kafka_data:
  minio_data:
  clickhouse_data:
  postgres_data:
  spark_ivy_cache:
